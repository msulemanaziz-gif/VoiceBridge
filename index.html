<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#4f46e5" />
<meta name="mobile-web-app-capable" content="yes" />
<title>VoiceBridge — Live Voice Interpreter</title>
<style>
  :root{
    --ink:#181633;--muted:#6b7280;--line:#e9e7fb;--card:#fff;
    --a:#4f46e5;--aBg:#eef2ff;--aInk:#2e2a7a;--aBd:#dcd9fb;
    --b:#0d9488;--bBg:#e6fbf5;--bInk:#0d564d;--bBd:#c6f5e8;
    --warn:#b45309;--danger:#dc2626;--ok:#059669;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Naskh Arabic",Helvetica,Arial,sans-serif;
    background:linear-gradient(160deg,#4f46e5,#7c3aed 55%,#0ea5e9);color:var(--ink);
    display:flex;align-items:center;justify-content:center;min-height:100dvh;overscroll-behavior:none}
  .app{width:100%;max-width:520px;background:#f8f7ff;display:flex;flex-direction:column;
    position:relative;height:100dvh;overflow:hidden}
  @media(min-width:620px){body{padding:16px}
    .app{height:auto;max-height:calc(100dvh - 32px);border-radius:28px;box-shadow:0 28px 64px rgba(49,26,138,.5)}}

  /* ---------- header ---------- */
  header{background:linear-gradient(135deg,#6d28d9,#4f46e5);color:#fff;
    padding:calc(14px + env(safe-area-inset-top)) 16px 14px}
  .brand{display:flex;align-items:center;gap:9px;font-weight:800;font-size:19px}
  .brand .dot{width:34px;height:34px;border-radius:11px;background:rgba(255,255,255,.2);
    display:grid;place-items:center;font-size:18px}
  .brand small{font-weight:600;font-size:11px;opacity:.9;display:block;margin-top:1px}
  .pair{display:flex;align-items:center;gap:8px;margin-top:12px}
  .pk{flex:1;min-width:0}
  .pk label{display:block;font-size:9.5px;letter-spacing:.6px;text-transform:uppercase;font-weight:800;margin:0 0 4px 3px}
  .pk.A label{color:#c7d2fe}.pk.B label{color:#99f6e4}
  select{width:100%;appearance:none;-webkit-appearance:none;border:none;border-radius:11px;
    padding:11px 10px;font-size:14px;font-weight:800;background:#fff;color:var(--ink);
    box-shadow:0 3px 9px rgba(0,0,0,.14)}
  .swapb{width:40px;height:40px;border-radius:12px;border:none;background:rgba(255,255,255,.24);
    color:#fff;font-size:18px;font-weight:800;cursor:pointer;flex:0 0 auto}

  /* ---------- state strip ---------- */
  .state{display:flex;align-items:center;gap:9px;padding:11px 14px;background:#fff;
    border-bottom:1px solid var(--line);font-weight:800;font-size:13.5px}
  .orb{width:13px;height:13px;border-radius:50%;background:#cbd5e1;flex:0 0 auto}
  .state.listening .orb{background:#2563eb;animation:pulse 1.2s infinite}
  .state.processing .orb{background:#d97706;animation:pulse 1.2s infinite}
  .state.translating .orb{background:#7c3aed;animation:pulse 1.2s infinite}
  .state.speaking .orb{background:#059669;animation:pulse 1.2s infinite}
  .state.paused .orb{background:#94a3b8}
  .state.error .orb{background:var(--danger)}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(37,99,235,.5)}70%{box-shadow:0 0 0 9px rgba(37,99,235,0)}100%{box-shadow:0 0 0 0 rgba(37,99,235,0)}}
  .state .lvl{flex:1;height:5px;background:#eef0f6;border-radius:5px;overflow:hidden}
  .state .lvl i{display:block;height:100%;width:0;background:linear-gradient(90deg,#4f46e5,#14b8a6);transition:width .09s}

  /* ---------- conversation ---------- */
  main{padding:14px;overflow-y:auto;flex:1;-webkit-overflow-scrolling:touch}
  .note{border-radius:12px;padding:10px 12px;font-size:12.5px;line-height:1.5;margin-bottom:11px}
  .note.warn{background:#fff7ed;border:1px solid #fed7aa;color:var(--warn)}
  .note.info{background:#eff6ff;border:1px solid #bfdbfe;color:#1d4ed8}
  .welcome{text-align:center;color:var(--muted);padding:22px 14px}
  .welcome .big{font-size:40px;margin-bottom:8px}
  .welcome h3{margin:0 0 6px;font-size:17px;color:var(--ink)}
  .welcome p{margin:0;font-size:13.5px;line-height:1.6}
  .turn{margin-bottom:13px;max-width:88%;animation:rise .18s ease}
  @keyframes rise{from{transform:translateY(6px);opacity:0}to{transform:none;opacity:1}}
  .turn.A{margin-right:auto}.turn.B{margin-left:auto}
  .who{font-size:10px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;margin:0 0 4px 3px}
  .turn.A .who{color:var(--a)}.turn.B .who{color:var(--b);text-align:right}
  .card{border-radius:16px;padding:11px 13px;border:1px solid}
  .turn.A .card{background:var(--aBg);border-color:var(--aBd);border-bottom-left-radius:5px}
  .turn.B .card{background:var(--bBg);border-color:var(--bBd);border-bottom-right-radius:5px}
  .said{font-size:15px;line-height:1.45;opacity:.72}
  .divider{height:1px;background:rgba(0,0,0,.08);margin:8px 0}
  .out{display:flex;align-items:flex-start;justify-content:space-between;gap:9px}
  .out .txt{font-size:19px;font-weight:700;line-height:1.45;flex:1}
  .turn.A .out .txt{color:var(--aInk)}.turn.B .out .txt{color:var(--bInk)}
  .replay{border:none;background:rgba(0,0,0,.07);width:33px;height:33px;border-radius:10px;
    cursor:pointer;font-size:15px;flex:0 0 auto}
  .rtl{direction:rtl;text-align:right}

  /* ---------- mic panels ---------- */
  footer{background:#fff;border-top:1px solid var(--line);padding:12px 14px calc(12px + env(safe-area-inset-bottom))}
  .mics{display:flex;gap:11px}
  .mic{flex:1;border:2px solid transparent;border-radius:17px;padding:13px 8px;cursor:pointer;
    color:#fff;display:flex;flex-direction:column;align-items:center;gap:3px;transition:transform .12s}
  .mic:active{transform:scale(.97)}
  .mic .flag{font-size:21px;line-height:1}
  .mic .nm{font-weight:800;font-size:15px}
  .mic .sub{font-size:10.5px;opacity:.92;font-weight:600}
  .mic.A{background:linear-gradient(135deg,#6366f1,#4f46e5)}
  .mic.B{background:linear-gradient(135deg,#14b8a6,#0d9488)}
  .mic.armed{outline:3px solid #fde68a;outline-offset:1px}
  .mic.on{background:linear-gradient(135deg,#ef4444,#f97316);animation:mp 1.25s infinite}
  @keyframes mp{0%{box-shadow:0 0 0 0 rgba(239,68,68,.5)}70%{box-shadow:0 0 0 15px rgba(239,68,68,0)}100%{box-shadow:0 0 0 0 rgba(239,68,68,0)}}
  .mic:disabled{opacity:.45;cursor:default}
  .ctrls{display:flex;gap:7px;margin-top:11px}
  .btn{flex:1;border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 4px;
    font-weight:800;font-size:12.5px;cursor:pointer;color:var(--ink)}
  .btn.primary{background:linear-gradient(135deg,#6d28d9,#4f46e5);color:#fff;border:none}
  .btn.stop{color:var(--danger)}
  .btn:disabled{opacity:.4}
  .more{display:flex;justify-content:center;gap:15px;margin-top:10px;font-size:12px}
  .lnk{border:none;background:none;color:var(--a);font-weight:700;cursor:pointer;text-decoration:underline;font-size:12px}
  .ver{text-align:center;font-size:10.5px;color:#a3a7b3;margin-top:7px}

  /* ---------- sheet ---------- */
  .sheet{position:absolute;inset:0;background:rgba(17,15,40,.72);display:none;place-items:center;padding:18px;z-index:40}
  .sheet.show{display:grid}
  .panel{background:#fff;border-radius:20px;padding:20px;width:100%;max-width:400px;max-height:92%;overflow:auto}
  .panel h2{margin:0 0 4px;font-size:18px}
  .panel p{margin:0 0 14px;color:var(--muted);font-size:12.5px;line-height:1.55}
  .rowc{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:13px;font-size:13.5px;font-weight:700}
  .rowc input[type=range]{flex:1;accent-color:var(--a)}
  .rowc .val{min-width:38px;text-align:right;color:var(--muted);font-weight:700}
  .seg{display:flex;gap:6px;background:#f1f0fa;padding:4px;border-radius:12px}
  .seg button{flex:1;border:none;background:none;padding:9px;border-radius:9px;font-weight:800;font-size:12.5px;cursor:pointer;color:var(--muted)}
  .seg button.on{background:#fff;color:var(--a);box-shadow:0 2px 6px rgba(0,0,0,.1)}
  .close{width:100%;border:none;border-radius:13px;padding:13px;font-weight:800;color:#fff;
    background:linear-gradient(135deg,#6d28d9,#4f46e5);cursor:pointer;font-size:14.5px;margin-top:6px}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand"><span class="dot">🎙️</span>
      <div>VoiceBridge<small>Live two-person voice interpreter</small></div></div>
    <div class="pair">
      <div class="pk A"><label>Person A speaks</label><select id="selA"></select></div>
      <button class="swapb" id="swap" title="Swap languages">⇄</button>
      <div class="pk B"><label>Person B speaks</label><select id="selB"></select></div>
    </div>
  </header>

  <div class="state" id="stateBar">
    <span class="orb"></span><span id="stateTxt">Ready — press Start conversation</span>
    <span class="lvl"><i id="lvl"></i></span>
  </div>

  <main id="convo">
    <div class="note warn" id="compat" style="display:none"></div>
    <div class="welcome" id="welcome">
      <div class="big">🗣️↔️🗣️</div>
      <h3>Live interpreter</h3>
      <p>Press <b>Start conversation</b>. Person A speaks, the app says it in Person B's language, then listens for the reply — automatically, back and forth.</p>
    </div>
  </main>

  <footer>
    <div class="mics">
      <button class="mic A" id="micA">
        <span class="flag" id="flagA">🇵🇰</span>
        <span class="nm" id="nameA">Urdu</span>
        <span class="sub">Person A · tap to speak</span>
      </button>
      <button class="mic B" id="micB">
        <span class="flag" id="flagB">🇸🇦</span>
        <span class="nm" id="nameB">Arabic</span>
        <span class="sub">Person B · tap to speak</span>
      </button>
    </div>
    <div class="ctrls">
      <button class="btn primary" id="startBtn">▶ Start conversation</button>
      <button class="btn" id="pauseBtn" disabled>⏸ Pause</button>
      <button class="btn stop" id="stopBtn" disabled>■ Stop</button>
    </div>
    <div class="more">
      <button class="lnk" id="settingsBtn">⚙︎ Settings</button>
      <button class="lnk" id="clearBtn">🗑 Clear</button>
      <button class="lnk" id="privacyBtn">🔒 Privacy</button>
    </div>
    <div class="ver" id="ver">v1.0 · interpreter</div>
  </footer>

  <div class="sheet" id="sheet"><div class="panel" id="panel"></div></div>
</div>

<script>
/* =====================================================================
   VoiceBridge — live two-person voice interpreter
   Modules:  Recognizer -> Translator -> Voice -> Conversation controller
   Each service is isolated behind a small interface so the provider can
   be swapped (e.g. pointed at a self-hosted backend) without touching
   the conversation logic.
   ===================================================================== */

/* ------------------------------ languages ------------------------------ */
const LANGS=[
  {c:"ur",n:"Urdu",     stt:"ur-PK", flag:"🇵🇰", rtl:true},
  {c:"ar",n:"Arabic",   stt:"ar-SA", flag:"🇸🇦", rtl:true},
  {c:"en",n:"English",  stt:"en-US", flag:"🇬🇧"},
  {c:"es",n:"Spanish",  stt:"es-ES", flag:"🇪🇸"},
  {c:"fr",n:"French",   stt:"fr-FR", flag:"🇫🇷"},
  {c:"de",n:"German",   stt:"de-DE", flag:"🇩🇪"},
  {c:"it",n:"Italian",  stt:"it-IT", flag:"🇮🇹"},
  {c:"pt",n:"Portuguese",stt:"pt-PT",flag:"🇵🇹"},
  {c:"nl",n:"Dutch",    stt:"nl-NL", flag:"🇳🇱"},
  {c:"ru",n:"Russian",  stt:"ru-RU", flag:"🇷🇺"},
  {c:"hi",n:"Hindi",    stt:"hi-IN", flag:"🇮🇳"},
  {c:"bn",n:"Bengali",  stt:"bn-BD", flag:"🇧🇩"},
  {c:"zh",n:"Chinese",  stt:"zh-CN", flag:"🇨🇳"},
  {c:"ja",n:"Japanese", stt:"ja-JP", flag:"🇯🇵"},
  {c:"ko",n:"Korean",   stt:"ko-KR", flag:"🇰🇷"},
  {c:"tr",n:"Turkish",  stt:"tr-TR", flag:"🇹🇷"},
  {c:"id",n:"Indonesian",stt:"id-ID",flag:"🇮🇩"},
  {c:"pl",n:"Polish",   stt:"pl-PL", flag:"🇵🇱"},
  {c:"uk",n:"Ukrainian",stt:"uk-UA", flag:"🇺🇦"},
  {c:"vi",n:"Vietnamese",stt:"vi-VN",flag:"🇻🇳"},
  {c:"th",n:"Thai",     stt:"th-TH", flag:"🇹🇭"},
];
const L=c=>LANGS.find(x=>x.c===c)||LANGS[0];
const $=id=>document.getElementById(id);

/* ------------------------------ settings ------------------------------ */
const CFG={
  a:"ur", b:"ar",
  auto:true,          // automatic speaker switching
  rate:1, volume:1, muted:false,
  minChars:2, silenceMs:1200,
};
try{
  const s=JSON.parse(localStorage.getItem("vb_cfg")||"{}");
  Object.assign(CFG,s);
}catch(_){}
const saveCfg=()=>{ try{ localStorage.setItem("vb_cfg",JSON.stringify(CFG)); }catch(_){} };

/* =========================== Translation service ===========================
   Abstraction layer: providers are tried in order until one succeeds.
   Add a self-hosted provider here to drop the public ones entirely.        */
const Translator=(()=>{
  const withTimeout=async(url,ms)=>{
    const c=new AbortController(); const t=setTimeout(()=>c.abort(),ms);
    try{ const r=await fetch(url,{signal:c.signal}); clearTimeout(t); return r; }
    catch(e){ clearTimeout(t); throw e; }
  };
  const providers=[
    { name:"primary", async run(text,from,to){
        const u="https://translate.googleapis.com/translate_a/single?client=gtx&sl="+
          encodeURIComponent(from)+"&tl="+encodeURIComponent(to)+"&dt=t&q="+encodeURIComponent(text);
        const r=await withTimeout(u,8000); if(!r.ok) throw new Error("HTTP "+r.status);
        const d=await r.json();
        if(!Array.isArray(d)||!Array.isArray(d[0])) throw new Error("bad shape");
        const out=d[0].map(s=>(s&&s[0])?s[0]:"").join("").trim();
        if(!out) throw new Error("empty"); return out;
      }},
    { name:"backup", async run(text,from,to){
        const u="https://api.mymemory.translated.net/get?q="+encodeURIComponent(text)+
          "&langpair="+encodeURIComponent(from)+"|"+encodeURIComponent(to);
        const r=await withTimeout(u,8000); if(!r.ok) throw new Error("HTTP "+r.status);
        const d=await r.json();
        const out=(d.responseData&&d.responseData.translatedText||"").trim();
        if(!out) throw new Error("empty"); return out;
      }},
  ];
  return { async translate(text,from,to){
      if(from===to) return text;
      let last=null;
      for(const p of providers){
        try{ return await p.run(text,from,to); }catch(e){ last=e; }
      }
      throw last||new Error("all providers failed");
  }};
})();

/* ============================== Voice service ==============================
   Speaks text. Prefers the most natural on-device voice; falls back to an
   online voice when the device has none (e.g. Urdu on most phones).
   Reports true completion so the controller knows when it is safe to
   re-open the microphone (echo prevention).                                */
const Voice=(()=>{
  let current=null, primed=false;
  const stopAudio=()=>{ try{ if(current){ current.onended=null; current.onerror=null;
    current.pause(); current.src=""; current=null; } }catch(_){} };

  const prime=()=>{                       // must run inside a user gesture
    if(primed) return; primed=true;
    if("speechSynthesis" in window){
      try{ const u=new SpeechSynthesisUtterance(" "); u.volume=0; speechSynthesis.speak(u); }catch(_){}
    }
    try{ const a=new Audio("data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQAAAAA=");
      a.play().catch(()=>{}); }catch(_){}
  };
  const score=v=>{ const n=(v.name||"").toLowerCase(); let s=0;
    if(/natural|neural|enhanced|premium|wavenet|siri/.test(n))s+=8;
    if(/google/.test(n))s+=5; if(/microsoft/.test(n))s+=2; if(!v.localService)s+=1; return s; };
  const pick=code=>{
    if(!("speechSynthesis" in window)) return null;
    const vs=speechSynthesis.getVoices().filter(v=>v.lang.toLowerCase().startsWith(code));
    if(!vs.length) return null;
    vs.sort((x,y)=>score(y)-score(x)); return vs[0];
  };
  if("speechSynthesis" in window){
    speechSynthesis.getVoices();
    speechSynthesis.onvoiceschanged=()=>speechSynthesis.getVoices();
  }

  const online=(text,code,done)=>{
    let fin=false, wd=null;
    const end=()=>{ if(fin)return; fin=true; if(wd)clearTimeout(wd); stopAudio(); done(); };
    const s0=text.trim(); if(!s0){ end(); return; }
    wd=setTimeout(end, Math.min(30000, 4000+s0.length*90));
    const parts=[]; let s=s0;
    while(s.length>180){ let i=s.lastIndexOf(" ",180); if(i<=0)i=180; parts.push(s.slice(0,i)); s=s.slice(i).trim(); }
    if(s)parts.push(s);
    const tl=code==="zh"?"zh-CN":code; let i=0;
    const urls=chunk=>{ const q=encodeURIComponent(chunk); return [
      "https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl="+tl+"&q="+q,
      "https://translate.googleapis.com/translate_tts?ie=UTF-8&client=gtx&tl="+tl+"&q="+q ]; };
    const play=chunk=>{
      const list=urls(chunk); let k=0;
      const attempt=()=>{
        if(fin) return;
        if(k>=list.length){ end(); return; }
        stopAudio();
        try{
          const a=new Audio(); a.src=list[k++]; a.playbackRate=CFG.rate;
          a.volume=CFG.muted?0:CFG.volume; current=a;
          a.onended=()=>{ if(i<parts.length) play(parts[i++]); else end(); };
          a.onerror=attempt;
          const p=a.play(); if(p&&p.catch) p.catch(attempt);
        }catch(_){ attempt(); }
      }; attempt();
    };
    play(parts[i++]);
  };

  return {
    prime, stop(){ try{ speechSynthesis.cancel(); }catch(_){} stopAudio(); },
    /** speak(text, langCode) -> Promise that resolves when audio truly finished */
    speak(text,code){
      return new Promise(resolve=>{
        if(!text || CFG.muted){ resolve(); return; }
        let done=false, wd=null, keep=null;
        const fin=()=>{ if(done)return; done=true; if(wd)clearTimeout(wd); if(keep)clearInterval(keep); resolve(); };
        const words=text.trim().split(/\s+/).length;
        wd=setTimeout(fin, Math.min(30000, 2500+words*600+text.length*25));
        const v=pick(code);
        if(v && "speechSynthesis" in window){
          let started=false, bailed=false;
          const toOnline=()=>{ if(done||bailed)return; bailed=true;
            if(wd)clearTimeout(wd); if(keep)clearInterval(keep);
            try{ speechSynthesis.cancel(); }catch(_){}
            online(text,code,()=>{ if(!done){ done=true; resolve(); } }); };
          try{
            const u=new SpeechSynthesisUtterance(text);
            u.lang=L(code).stt; u.voice=v; u.rate=CFG.rate; u.pitch=1.02; u.volume=CFG.volume;
            u.onstart=()=>{ started=true; };
            u.onend=()=>{ if(!bailed) fin(); };
            u.onerror=e=>{ if(bailed)return;
              if(e.error&&e.error!=="interrupted"&&e.error!=="canceled") toOnline(); else fin(); };
            try{ speechSynthesis.cancel(); }catch(_){}
            setTimeout(()=>{ if(!done&&!bailed){ try{ speechSynthesis.speak(u); }catch(_){ toOnline(); } } },80);
            setTimeout(()=>{ let sp=false; try{ sp=speechSynthesis.speaking; }catch(_){}
              if(!started&&!sp) toOnline(); },1100);
            keep=setInterval(()=>{ try{ if(speechSynthesis.speaking) speechSynthesis.resume(); }catch(_){} },5000);
          }catch(_){ toOnline(); }
        } else {
          online(text,code,fin);
        }
      });
    }
  };
})();

/* ============================ Recognizer service ===========================
   Wraps the browser speech engine. The controller owns the lifecycle so the
   microphone can be fully released before any audio plays.                  */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
const Recognizer=(()=>{
  let rec=null;
  const release=()=>{                    // full teardown, not just stop()
    if(!rec) return;
    try{ rec.onresult=rec.onerror=rec.onend=rec.onstart=rec.onspeechend=null; }catch(_){}
    try{ rec.abort&&rec.abort(); }catch(_){}
    try{ rec.stop&&rec.stop(); }catch(_){}
    rec=null;
  };
  return {
    release, get active(){ return !!rec; },
    /**
     * listen({lang, onPartial, onFinal, onError, onSilence})
     * Resolves nothing; the controller reacts through callbacks.
     */
    listen(o){
      release();
      if(!SR){ o.onError&&o.onError("unsupported"); return; }
      const r=new SR();
      rec=r;
      r.lang=o.lang; r.interimResults=true; r.continuous=false; r.maxAlternatives=1;
      let got=false, heard=false;
      r.onstart=()=>o.onStart&&o.onStart();
      r.onresult=e=>{
        let interim="",final="";
        for(let i=e.resultIndex;i<e.results.length;i++){
          const t=e.results[i][0].transcript;
          if(e.results[i].isFinal) final+=t; else interim+=t;
        }
        if(interim.trim()){ heard=true; o.onPartial&&o.onPartial(interim.trim()); }
        const f=final.trim();
        if(f.length>=CFG.minChars){ got=true; release(); o.onFinal&&o.onFinal(f); }
      };
      r.onerror=e=>{
        const err=e.error||"unknown";
        if(err==="not-allowed"||err==="service-not-allowed"){ release(); o.onError&&o.onError("mic-denied"); }
        else if(err==="no-speech"){ /* handled in onend */ }
        else if(err!=="aborted"){ o.onError&&o.onError(err); }
      };
      r.onend=()=>{
        if(rec===r) rec=null;
        if(!got) o.onSilence&&o.onSilence(heard);
      };
      try{ r.start(); }
      catch(_){ setTimeout(()=>{ try{ r.start(); }catch(__){ o.onError&&o.onError("start-failed"); } },300); }
    }
  };
})();

/* ============================== Level meter =============================== */
const Meter=(()=>{
  let ctx=null, stream=null, raf=null;
  return {
    async start(){
      if(ctx) return;
      try{
        stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}});
        ctx=new (window.AudioContext||window.webkitAudioContext)();
        const src=ctx.createMediaStreamSource(stream);
        const an=ctx.createAnalyser(); an.fftSize=512; src.connect(an);
        const buf=new Uint8Array(an.frequencyBinCount);
        const tick=()=>{ if(!ctx) return;
          an.getByteTimeDomainData(buf);
          let sum=0; for(let i=0;i<buf.length;i++){ const v=(buf[i]-128)/128; sum+=v*v; }
          $("lvl").style.width=Math.min(100,Math.sqrt(sum/buf.length)*300)+"%";
          raf=requestAnimationFrame(tick); };
        tick();
      }catch(_){}
    },
    stop(){
      if(raf) cancelAnimationFrame(raf); raf=null;
      try{ if(ctx) ctx.close(); }catch(_){} ctx=null;
      try{ if(stream) stream.getTracks().forEach(t=>t.stop()); }catch(_){} stream=null;
      const el=$("lvl"); if(el) el.style.width="0%";
    }
  };
})();

/* ========================== Conversation controller ========================
   State machine — the heart of the interpreter.
   idle -> listening -> processing -> translating -> speaking -> (switch) ...
   While SPEAKING the microphone is fully released, which is what prevents
   the app from hearing and re-translating its own voice.                    */
const ST={IDLE:"idle",LISTENING:"listening",PROCESSING:"processing",
  TRANSLATING:"translating",SPEAKING:"speaking",PAUSED:"paused",ERROR:"error"};

const Convo=(()=>{
  let state=ST.IDLE, running=false, side="A", turnSeq=0, liveEl=null;
  const history=[];                       // short-term context (see note in Settings)

  const langOf=s=>s==="A"?CFG.a:CFG.b;
  const otherOf=s=>s==="A"?"B":"A";

  function setState(s,msg){
    state=s;
    const bar=$("stateBar");
    bar.className="state "+(s===ST.ERROR?"error":s);
    $("stateTxt").textContent=msg;
  }
  function armUI(){
    $("micA").classList.toggle("armed",running&&side==="A"&&state!==ST.LISTENING);
    $("micB").classList.toggle("armed",running&&side==="B"&&state!==ST.LISTENING);
    $("micA").classList.toggle("on",running&&side==="A"&&state===ST.LISTENING);
    $("micB").classList.toggle("on",running&&side==="B"&&state===ST.LISTENING);
    $("startBtn").disabled=running;
    $("pauseBtn").disabled=!running;
    $("stopBtn").disabled=!running&&state===ST.IDLE;
    $("pauseBtn").textContent=(state===ST.PAUSED)?"▶ Resume":"⏸ Pause";
  }

  /* ---- one listening turn ---- */
  function listen(which){
    if(!running) return;
    side=which; turnSeq++;
    const seq=turnSeq, lang=langOf(which);
    setState(ST.LISTENING,"Listening to "+L(lang).n+"…");
    armUI(); Meter.start();
    Recognizer.listen({
      lang:L(lang).stt,
      onStart(){ if(seq===turnSeq) armUI(); },
      onPartial(text){
        if(seq!==turnSeq) return;
        if(!liveEl) liveEl=UI.addTurn(which,text,"…",langOf(otherOf(which)),true);
        else UI.updateSaid(liveEl,text);
      },
      onFinal(text){ if(seq===turnSeq) process(which,text,seq); },
      onError(err){
        if(seq!==turnSeq) return;
        if(err==="mic-denied"){ stop(); setState(ST.ERROR,"Microphone blocked — allow it in your browser settings"); armUI(); return; }
        if(err==="unsupported"){ stop(); setState(ST.ERROR,"Voice input needs Chrome or Edge"); armUI(); return; }
        if(err==="network"){ setState(ST.ERROR,"Network problem — retrying…"); }
        if(running) setTimeout(()=>{ if(running&&seq===turnSeq) listen(which); },700);
      },
      onSilence(heard){
        if(seq!==turnSeq||!running) return;
        if(liveEl){ UI.removeTurn(liveEl); liveEl=null; }
        if(!heard && CFG.auto){          // nothing said -> offer the turn to the other person
          const nx=otherOf(which);
          setState(ST.LISTENING,"Waiting — now "+L(langOf(nx)).n);
          setTimeout(()=>{ if(running&&seq===turnSeq) listen(nx); },350);
        } else {
          setTimeout(()=>{ if(running&&seq===turnSeq) listen(which); },250);
        }
      }
    });
  }

  /* ---- transcript -> translation -> speech ---- */
  async function process(which,text,seq){
    Recognizer.release(); Meter.stop();     // mic OFF before anything plays (echo guard)
    const from=langOf(which), to=langOf(otherOf(which));
    setState(ST.PROCESSING,"Understanding "+L(from).n+"…");

    const el=liveEl||UI.addTurn(which,text,"…",to,true);
    liveEl=null;
    UI.updateSaid(el,text);

    setState(ST.TRANSLATING,"Translating "+L(from).n+" → "+L(to).n+"…");
    let out;
    try{
      out=await Translator.translate(text,from,to);
    }catch(e){
      UI.finishTurn(el,"(couldn't translate — please say that again)",to);
      setState(ST.ERROR,"Translation failed — check your internet");
      if(running && seq===turnSeq) setTimeout(()=>{ if(running) listen(which); },900);
      return;
    }
    if(seq!==turnSeq) return;               // superseded by a manual tap
    UI.finishTurn(el,out,to);
    history.push({side:which,from,to,said:text,out});
    if(history.length>12) history.shift();

    setState(ST.SPEAKING,"Speaking "+L(to).n+"…");
    armUI();
    await Voice.speak(out,to);              // mic stays closed for the whole playback
    if(!running || seq!==turnSeq) return;

    if(CFG.auto){
      const nx=otherOf(which);
      setState(ST.LISTENING,"Now "+L(langOf(nx)).n+" — go ahead");
      setTimeout(()=>{ if(running&&seq===turnSeq) listen(nx); },450);   // settle before re-opening mic
    }else{
      setState(ST.IDLE,"Tap a microphone to speak");
      armUI();
    }
  }

  /* ---- public controls ---- */
  function start(which){
    Voice.prime();
    running=true;
    listen(which||side||"A");
  }
  function manualTap(which){
    Voice.prime();
    Voice.stop();
    if(liveEl){ UI.removeTurn(liveEl); liveEl=null; }
    running=true;
    turnSeq++;                              // invalidate any in-flight turn
    listen(which);
  }
  function pause(){
    if(state===ST.PAUSED){ running=true; setState(ST.LISTENING,"Resuming…"); armUI(); listen(side); return; }
    running=false; turnSeq++;
    Recognizer.release(); Voice.stop(); Meter.stop();
    if(liveEl){ UI.removeTurn(liveEl); liveEl=null; }
    setState(ST.PAUSED,"Paused — press Resume to continue"); armUI();
  }
  function stop(){
    running=false; turnSeq++;
    Recognizer.release(); Voice.stop(); Meter.stop();
    if(liveEl){ UI.removeTurn(liveEl); liveEl=null; }
    setState(ST.IDLE,"Stopped — press Start conversation"); armUI();
  }
  return {start,manualTap,pause,stop,armUI,setState,
    get state(){return state;}, get running(){return running;}, get side(){return side;},
    get history(){return history;}};
})();

/* ================================== UI ================================== */
const UI=(()=>{
  function fillSelects(){
    const opt=(sel,cur)=>LANGS.map(l=>`<option value="${l.c}" ${l.c===cur?"selected":""}>${l.flag} ${l.n}</option>`).join("");
    $("selA").innerHTML=opt($("selA"),CFG.a);
    $("selB").innerHTML=opt($("selB"),CFG.b);
  }
  function refreshLabels(){
    const A=L(CFG.a),B=L(CFG.b);
    $("flagA").textContent=A.flag; $("nameA").textContent=A.n;
    $("flagB").textContent=B.flag; $("nameB").textContent=B.n;
  }
  function addTurn(which,said,out,outLang,live){
    $("welcome").style.display="none";
    const inLang=which==="A"?CFG.a:CFG.b;
    const w=document.createElement("div");
    w.className="turn "+which;
    w.innerHTML=
      '<div class="who"></div><div class="card">'+
      '<div class="said"></div><div class="divider"></div>'+
      '<div class="out"><div class="txt"></div><button class="replay" title="Replay">🔊</button></div></div>';
    w.querySelector(".who").textContent=(which==="A"?"👤 Person A · ":"🧑 Person B · ")+L(inLang).n;
    const saidEl=w.querySelector(".said"), txtEl=w.querySelector(".txt");
    saidEl.textContent=said; txtEl.textContent=out;
    if(L(inLang).rtl) saidEl.classList.add("rtl");
    if(L(outLang).rtl) txtEl.classList.add("rtl");
    w.dataset.lang=outLang;
    w.querySelector(".replay").onclick=()=>{
      Voice.prime();
      const t=w.querySelector(".txt").textContent;
      if(t&&t!=="…") Voice.speak(t,w.dataset.lang);
    };
    $("convo").appendChild(w);
    $("convo").scrollTop=$("convo").scrollHeight;
    return w;
  }
  const updateSaid=(el,text)=>{ el.querySelector(".said").textContent=text;
    $("convo").scrollTop=$("convo").scrollHeight; };
  const finishTurn=(el,out,outLang)=>{
    const t=el.querySelector(".txt");
    t.textContent=out; t.classList.toggle("rtl",!!L(outLang).rtl);
    el.dataset.lang=outLang;
    $("convo").scrollTop=$("convo").scrollHeight;
  };
  const removeTurn=el=>{ try{ el.remove(); }catch(_){} };
  return {fillSelects,refreshLabels,addTurn,updateSaid,finishTurn,removeTurn};
})();

/* ============================== wiring ============================== */
UI.fillSelects(); UI.refreshLabels(); Convo.armUI();

const secure=window.isSecureContext||location.protocol==="https:"||location.hostname==="localhost";
if(!SR){
  $("compat").style.display="block";
  $("compat").innerHTML="⚠️ <b>Voice input needs Google Chrome or Edge</b> (Android or desktop). iPhone browsers don't support it.";
}else if(!secure){
  $("compat").style.display="block";
  $("compat").innerHTML="⚠️ Open this page from an <b>https://</b> address — browsers block the microphone otherwise.";
}

$("startBtn").onclick=()=>Convo.start("A");
$("pauseBtn").onclick=()=>Convo.pause();
$("stopBtn").onclick=()=>Convo.stop();
$("micA").onclick=()=>Convo.manualTap("A");
$("micB").onclick=()=>Convo.manualTap("B");
$("clearBtn").onclick=()=>{
  document.querySelectorAll(".turn").forEach(t=>t.remove());
  $("welcome").style.display="block";
  Convo.setState(Convo.running?"listening":"idle",Convo.running?"Listening…":"Cleared — press Start conversation");
};
$("selA").onchange=e=>{ CFG.a=e.target.value; saveCfg(); UI.refreshLabels(); Convo.stop(); };
$("selB").onchange=e=>{ CFG.b=e.target.value; saveCfg(); UI.refreshLabels(); Convo.stop(); };
$("swap").onclick=()=>{ const t=CFG.a; CFG.a=CFG.b; CFG.b=t;
  $("selA").value=CFG.a; $("selB").value=CFG.b; saveCfg(); UI.refreshLabels(); Convo.stop(); };

/* ---- sheets ---- */
function openSheet(html,after){
  $("panel").innerHTML=html; $("sheet").classList.add("show");
  $("panel").querySelectorAll("[data-close]").forEach(b=>b.onclick=()=>$("sheet").classList.remove("show"));
  after&&after();
}
$("settingsBtn").onclick=()=>openSheet(`
  <h2>Settings</h2>
  <p>Tune how the interpreter listens and speaks.</p>
  <div class="rowc"><span>Speaker switching</span></div>
  <div class="seg" style="margin-bottom:14px">
    <button id="segAuto" class="${CFG.auto?"on":""}">Automatic</button>
    <button id="segMan" class="${CFG.auto?"":"on"}">Manual mic</button>
  </div>
  <div class="rowc"><span>Voice speed</span><input type="range" id="rate" min="0.6" max="1.4" step="0.05" value="${CFG.rate}"><span class="val" id="rateV">${CFG.rate.toFixed(2)}×</span></div>
  <div class="rowc"><span>Volume</span><input type="range" id="vol" min="0" max="1" step="0.05" value="${CFG.volume}"><span class="val" id="volV">${Math.round(CFG.volume*100)}%</span></div>
  <div class="rowc"><span>Mute voice</span><input type="checkbox" id="mute" ${CFG.muted?"checked":""} style="width:20px;height:20px;accent-color:var(--a)"></div>
  <div class="rowc"><span>Pause before switching</span><input type="range" id="sil" min="600" max="2500" step="100" value="${CFG.silenceMs}"><span class="val" id="silV">${(CFG.silenceMs/1000).toFixed(1)}s</span></div>
  <button class="close" data-close>Done</button>
`,()=>{
  $("segAuto").onclick=()=>{ CFG.auto=true; saveCfg(); $("segAuto").classList.add("on"); $("segMan").classList.remove("on"); };
  $("segMan").onclick=()=>{ CFG.auto=false; saveCfg(); $("segMan").classList.add("on"); $("segAuto").classList.remove("on"); };
  $("rate").oninput=e=>{ CFG.rate=parseFloat(e.target.value); $("rateV").textContent=CFG.rate.toFixed(2)+"×"; saveCfg(); };
  $("vol").oninput=e=>{ CFG.volume=parseFloat(e.target.value); $("volV").textContent=Math.round(CFG.volume*100)+"%"; saveCfg(); };
  $("mute").onchange=e=>{ CFG.muted=e.target.checked; saveCfg(); if(CFG.muted) Voice.stop(); };
  $("sil").oninput=e=>{ CFG.silenceMs=parseInt(e.target.value,10); $("silV").textContent=(CFG.silenceMs/1000).toFixed(1)+"s"; saveCfg(); };
});
$("privacyBtn").onclick=()=>openSheet(`
  <h2>Privacy</h2>
  <p>What this app does and does not keep.</p>
  <div class="note info" style="margin-bottom:12px">
    <b>Not stored:</b> your voice is never recorded or saved. The conversation on screen lives only in this browser tab and disappears when you close or clear it.<br><br>
    <b>Stored on this device only:</b> your chosen languages and voice settings.<br><br>
    <b>Sent over the internet:</b> to translate and speak, the recognised text is sent to the translation and voice services. Avoid speaking passwords, card numbers or other sensitive details — as with any online translator.
  </div>
  <button class="close" data-close>Close</button>
`);
</script>
